<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexia - Biblioteca de PDFs</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- PDF.js para el visor embebido -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- JSZip + epub.js para el visor de EPUB embebido -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epubjs/0.3.93/epub.min.js"></script>

<style>
  :root{
    --bg:#f4f1ea;
    --bg-card:#ffffff;
    --text:#1a1a2e;
    --text-soft:#5a5a72;
    --navy:#0d1b3e;
    --gold:#c9a227;
    --gold-light:#e6c761;
    --border:#e0dccf;
    --shadow: rgba(13,27,62,0.12);
    --danger:#b3382c;
  }
  [data-theme="dark"]{
    --bg:#0f1220;
    --bg-card:#1a1e30;
    --text:#eae7dd;
    --text-soft:#a3a3b8;
    --navy:#0d1b3e;
    --gold:#d4b13a;
    --gold-light:#e8cd6e;
    --border:#2a2e42;
    --shadow: rgba(0,0,0,0.4);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:background .3s, color .3s;
    min-height:100vh;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    background:var(--navy);
    box-shadow:0 2px 10px var(--shadow);
    flex-wrap:wrap;
    gap:12px;
  }

  .logo-wrap{ display:flex; align-items:center; gap:12px; }

  .logo{
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--navy) 0%, #1a2f5e 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 2px var(--gold), 0 4px 10px rgba(0,0,0,0.3);
  }
  .logo svg{ width:28px; height:28px; }

  .brand-name{
    font-size:22px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--gold-light);
    text-transform:uppercase;
  }

  .header-controls{ display:flex; align-items:center; gap:14px; }

  .theme-toggle{
    background:none;
    border:2px solid var(--gold);
    border-radius:50%;
    width:38px;
    height:38px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:var(--gold-light);
    transition:transform .2s;
  }
  .theme-toggle:hover{ transform:scale(1.1); }

  .lock-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:22px;
    color:var(--gold-light);
    display:flex;
    align-items:center;
  }

  main{ max-width:1200px; margin:0 auto; padding:24px; }

  .toolbar{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:24px;
  }

  .search-box{
    flex:1;
    min-width:220px;
    display:flex;
    align-items:center;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 16px;
    box-shadow:0 2px 6px var(--shadow);
  }
  .search-box input{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-size:15px;
    width:100%;
    margin-left:8px;
  }
  .search-box svg{ flex-shrink:0; opacity:.6; }

  .view-toggle{
    display:flex;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }
  .view-toggle button{
    border:none;
    background:transparent;
    padding:10px 14px;
    cursor:pointer;
    color:var(--text-soft);
    font-size:16px;
  }
  .view-toggle button.active{
    background:var(--navy);
    color:var(--gold-light);
  }

  /* Grid view */
  #library.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:20px;
  }
  .book-card{
    background:var(--bg-card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 10px var(--shadow);
    cursor:pointer;
    transition:transform .2s, box-shadow .2s;
    display:flex;
    flex-direction:column;
  }
  .book-card:hover{ transform:translateY(-4px); box-shadow:0 6px 18px var(--shadow); }
  .book-cover{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    background:linear-gradient(135deg,var(--navy),#25376b);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold-light);
    font-size:12px;
    text-align:center;
    padding:8px;
  }
  .book-info{ padding:10px 12px; }
  .book-title{ font-weight:600; font-size:14px; margin:0 0 4px; line-height:1.3; }
  .book-meta{ font-size:12px; color:var(--text-soft); margin:0; }

  /* List view */
  #library.list{ display:flex; flex-direction:column; gap:10px; }
  #library.list .book-card{
    flex-direction:row;
    align-items:center;
  }
  #library.list .book-cover{
    width:60px;
    height:90px;
    aspect-ratio:unset;
    flex-shrink:0;
    font-size:10px;
  }
  #library.list .book-info{ flex:1; }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-soft);
  }

  /* Modal / lector */
  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.active{ display:flex; }

  .modal-box{
    background:var(--bg-card);
    border-radius:16px;
    width:100%;
    max-width:900px;
    max-height:90vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
  }
  .modal-header h3{ margin:0; font-size:16px; }
  .modal-close{
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
    color:var(--text-soft);
  }
  .reader-body{
    flex:1;
    overflow:auto;
    background:#333;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
  }
  .reader-body canvas{
    box-shadow:0 4px 15px rgba(0,0,0,0.4);
    max-width:100%;
    margin-bottom:10px;
  }
  #epubViewer{
    width:100%;
    height:70vh;
    background:#fff;
    border-radius:6px;
    box-shadow:0 4px 15px rgba(0,0,0,0.4);
  }
  .reader-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--bg-card);
  }
  .reader-controls button{
    background:var(--navy);
    color:var(--gold-light);
    border:none;
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
  }
  .reader-controls button:disabled{ opacity:.4; cursor:not-allowed; }

  /* Login modal */
  .login-box{ max-width:360px; padding:24px; text-align:center; }
  .login-box input{
    width:100%;
    padding:12px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    margin:16px 0;
    outline:none;
  }
  .login-box button{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:var(--navy);
    color:var(--gold-light);
    font-weight:600;
    cursor:pointer;
    font-size:15px;
  }
  .login-error{ color:var(--danger); font-size:13px; min-height:18px; }

  /* Admin panel */
  .admin-panel{ padding:24px; max-width:700px; }
  .admin-panel h3{ margin-top:0; }
  .admin-form{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .admin-form input,
  .admin-form select{
    padding:10px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:14px;
  }
  .admin-form button{
    padding:10px;
    border-radius:10px;
    border:none;
    background:var(--navy);
    color:var(--gold-light);
    font-weight:600;
    cursor:pointer;
  }
  .admin-list{ max-height:300px; overflow:auto; border-top:1px solid var(--border); padding-top:10px; }
  .admin-list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .admin-list-item button{
    background:var(--danger);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    font-size:12px;
  }

  .progress-badge{
    display:inline-block;
    font-size:11px;
    background:var(--gold);
    color:var(--navy);
    padding:2px 8px;
    border-radius:20px;
    margin-top:4px;
  }
  .format-badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    letter-spacing:.5px;
    background:var(--navy);
    color:var(--gold-light);
    padding:2px 7px;
    border-radius:6px;
    margin-left:6px;
    vertical-align:middle;
  }
</style>
</head>
<body data-theme="light">

<header>
  <div class="logo-wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4C4 4 8 2 12 4C16 2 20 4 20 4V18C20 18 16 16 12 18C8 16 4 18 4 18V4Z" stroke="#c9a227" stroke-width="1.5"/>
        <path d="M12 4V18" stroke="#c9a227" stroke-width="1.5"/>
        <path d="M6.5 8L9.5 8M6.5 11L9.5 11M14.5 8L17.5 8M14.5 11L17.5 11" stroke="#e6c761" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="brand-name">Lexia</span>
  </div>
  <div class="header-controls">
    <button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
    <button class="lock-btn" id="adminAccessBtn" title="Panel de administración">🔒</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="searchInput" type="text" placeholder="Buscar por título o autor...">
    </div>
    <div class="view-toggle">
      <button id="gridBtn" class="active" title="Vista de grilla">▦</button>
      <button id="listBtn" title="Vista de lista">☰</button>
    </div>
  </div>

  <div id="library" class="grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">No se encontraron libros.</div>
</main>

<!-- Modal lector -->
<div class="modal-overlay" id="readerModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="readerTitle">Título del libro</h3>
      <button class="modal-close" id="closeReader">&times;</button>
    </div>
    <div class="reader-body" id="readerBody">
      <canvas id="pdfCanvas"></canvas>
      <div id="epubViewer" style="display:none;"></div>
    </div>
    <div class="reader-controls">
      <button id="prevPage">‹ Anterior</button>
      <span id="pageIndicator">Página 1 de 1</span>
      <button id="nextPage">Siguiente ›</button>
    </div>
  </div>
</div>

<!-- Modal login admin -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box login-box">
    <div class="modal-header">
      <h3>Acceso administrador</h3>
      <button class="modal-close" id="closeLogin">&times;</button>
    </div>
    <input type="password" id="passwordInput" placeholder="Contraseña">
    <div class="login-error" id="loginError"></div>
    <button id="loginSubmit">Ingresar</button>
  </div>
</div>

<!-- Modal panel admin -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-box admin-panel">
    <div class="modal-header">
      <h3>Panel de administración</h3>
      <button class="modal-close" id="closeAdmin">&times;</button>
    </div>
    <div style="padding:20px;">
      <div class="admin-form">
        <input type="text" id="newTitle" placeholder="Título">
        <input type="text" id="newAuthor" placeholder="Autor">
        <select id="newFileType">
          <option value="pdf">PDF</option>
          <option value="epub">EPUB</option>
        </select>
        <input type="url" id="newPdfUrl" placeholder="URL del archivo (Google Drive u otro hosting)">
        <input type="url" id="newCoverUrl" placeholder="URL de la portada (opcional)">
        <input type="number" id="newPages" placeholder="Cantidad de páginas">
        <input type="number" id="newYear" placeholder="Año de publicación">
        <button id="addBookBtn">Agregar libro</button>
      </div>
      <div class="admin-list" id="adminList"></div>
    </div>
  </div>
</div>

<script>
/* ============ CONFIGURACIÓN FIREBASE ============ */
/* Reemplazar con las credenciales del proyecto Firebase */
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============ CONFIG PDF.js ============ */
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const ADMIN_PASSWORD = "Maite1805";

let books = [];
let currentView = localStorage.getItem('lexia-view') || 'grid';
let currentPdfDoc = null;
let currentPage = 1;
let currentBookId = null;
let currentFileType = 'pdf';
let currentEpubBook = null;
let currentEpubRendition = null;

/* ============ TEMA ============ */
function initTheme(){
  const saved = localStorage.getItem('lexia-theme') || 'light';
  document.body.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.body.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', next);
  localStorage.setItem('lexia-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
});
initTheme();

/* ============ VISTA GRILLA / LISTA ============ */
function setView(view){
  currentView = view;
  localStorage.setItem('lexia-view', view);
  document.getElementById('library').className = view;
  document.getElementById('gridBtn').classList.toggle('active', view === 'grid');
  document.getElementById('listBtn').classList.toggle('active', view === 'list');
}
document.getElementById('gridBtn').addEventListener('click', () => setView('grid'));
document.getElementById('listBtn').addEventListener('click', () => setView('list'));
setView(currentView);

/* ============ CARGA DE LIBROS DESDE FIRESTORE ============ */
function loadBooks(){
  db.collection('books').orderBy('title').onSnapshot(snapshot => {
    books = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderLibrary();
    renderAdminList();
  }, err => {
    console.error("Error cargando libros:", err);
  });
}

/* ============ RENDER BIBLIOTECA ============ */
function renderLibrary(){
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = books.filter(b =>
    b.title.toLowerCase().includes(query) ||
    (b.author || '').toLowerCase().includes(query)
  );

  const lib = document.getElementById('library');
  const empty = document.getElementById('emptyState');
  lib.innerHTML = '';

  if (filtered.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  filtered.forEach(book => {
    const progress = getProgress(book.id);
    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      ${book.coverUrl
        ? `<img class="book-cover" src="${book.coverUrl}" alt="${book.title}">`
        : `<div class="book-cover">${book.title}</div>`}
      <div class="book-info">
        <p class="book-title">${book.title}<span class="format-badge">${(book.fileType || 'pdf').toUpperCase()}</span></p>
        <p class="book-meta">${book.author || 'Autor desconocido'}</p>
        <p class="book-meta">${book.pages || '?'} páginas · ${book.year || '?'}</p>
        ${progress ? `<span class="progress-badge">${(book.fileType || 'pdf') === 'epub' ? 'En curso' : 'Pág. ' + progress}</span>` : ''}
      </div>
    `;
    card.addEventListener('click', () => openReader(book));
    lib.appendChild(card);
  });
}

document.getElementById('searchInput').addEventListener('input', renderLibrary);

/* ============ PROGRESO DE LECTURA (localStorage) ============ */
function getProgress(bookId){
  return localStorage.getItem('lexia-progress-' + bookId);
}
function saveProgress(bookId, page){
  localStorage.setItem('lexia-progress-' + bookId, page);
}

/* ============ LECTOR PDF / EPUB EMBEBIDO ============ */
function getFileUrl(book){
  return book.fileUrl || book.pdfUrl;
}

async function openReader(book){
  currentBookId = book.id;
  currentFileType = book.fileType || 'pdf';
  document.getElementById('readerTitle').textContent = book.title;
  document.getElementById('readerModal').classList.add('active');

  const canvas = document.getElementById('pdfCanvas');
  const epubViewer = document.getElementById('epubViewer');

  if (currentFileType === 'epub'){
    canvas.style.display = 'none';
    epubViewer.style.display = 'block';
    await openEpubReader(book);
  } else {
    epubViewer.style.display = 'none';
    canvas.style.display = '';
    await openPdfReader(book);
  }
}

async function openPdfReader(book){
  try {
    currentPdfDoc = await pdfjsLib.getDocument(getFileUrl(book)).promise;
    const savedPage = parseInt(getProgress(book.id)) || 1;
    currentPage = Math.min(savedPage, currentPdfDoc.numPages);
    renderPage(currentPage);
  } catch(err){
    console.error("Error cargando el PDF:", err);
    document.getElementById('readerBody').innerHTML = '<p style="color:#fff;">No se pudo cargar el PDF. Verificá la URL.</p>';
  }
}

async function renderPage(num){
  if (!currentPdfDoc) return;
  const page = await currentPdfDoc.getPage(num);
  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  const viewport = page.getViewport({ scale: 1.4 });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: ctx, viewport }).promise;

  document.getElementById('pageIndicator').textContent = `Página ${num} de ${currentPdfDoc.numPages}`;
  document.getElementById('prevPage').disabled = num <= 1;
  document.getElementById('nextPage').disabled = num >= currentPdfDoc.numPages;

  saveProgress(currentBookId, num);
}

async function openEpubReader(book){
  document.getElementById('pageIndicator').textContent = 'Cargando EPUB…';
  document.getElementById('prevPage').disabled = true;
  document.getElementById('nextPage').disabled = true;

  try {
    currentEpubBook = ePub(getFileUrl(book));
    currentEpubRendition = currentEpubBook.renderTo('epubViewer', {
      width: '100%',
      height: '100%'
    });

    const savedCfi = getProgress(book.id);
    await currentEpubRendition.display(savedCfi || undefined);

    document.getElementById('prevPage').disabled = false;
    document.getElementById('nextPage').disabled = false;
    document.getElementById('pageIndicator').textContent = 'Lectura de EPUB';

    currentEpubRendition.on('relocated', (location) => {
      saveProgress(currentBookId, location.start.cfi);
      if (currentEpubBook.locations && currentEpubBook.locations.length()){
        const pct = Math.round(currentEpubBook.locations.percentageFromCfi(location.start.cfi) * 100);
        document.getElementById('pageIndicator').textContent = `${pct}% completado`;
      }
    });

    currentEpubBook.locations.generate(1600).catch(() => {});
  } catch(err){
    console.error("Error cargando el EPUB:", err);
    document.getElementById('epubViewer').innerHTML = '<p style="padding:20px;">No se pudo cargar el EPUB. Verificá la URL.</p>';
  }
}

function destroyEpubReader(){
  if (currentEpubBook){
    try { currentEpubBook.destroy(); } catch(e){}
  }
  currentEpubBook = null;
  currentEpubRendition = null;
  document.getElementById('epubViewer').innerHTML = '';
}

document.getElementById('prevPage').addEventListener('click', () => {
  if (currentFileType === 'epub'){
    if (currentEpubRendition) currentEpubRendition.prev();
  } else if (currentPage > 1){
    currentPage--; renderPage(currentPage);
  }
});
document.getElementById('nextPage').addEventListener('click', () => {
  if (currentFileType === 'epub'){
    if (currentEpubRendition) currentEpubRendition.next();
  } else if (currentPdfDoc && currentPage < currentPdfDoc.numPages){
    currentPage++; renderPage(currentPage);
  }
});
document.getElementById('closeReader').addEventListener('click', () => {
  document.getElementById('readerModal').classList.remove('active');
  currentPdfDoc = null;
  destroyEpubReader();
});

/* ============ LOGIN ADMIN ============ */
document.getElementById('adminAccessBtn').addEventListener('click', () => {
  document.getElementById('loginModal').classList.add('active');
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginError').textContent = '';
});
document.getElementById('closeLogin').addEventListener('click', () => {
  document.getElementById('loginModal').classList.remove('active');
});
document.getElementById('loginSubmit').addEventListener('click', attemptLogin);
document.getElementById('passwordInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') attemptLogin();
});
function attemptLogin(){
  const pass = document.getElementById('passwordInput').value;
  if (pass === ADMIN_PASSWORD){
    document.getElementById('loginModal').classList.remove('active');
    document.getElementById('adminModal').classList.add('active');
  } else {
    document.getElementById('loginError').textContent = 'Contraseña incorrecta.';
  }
}

/* ============ PANEL ADMIN ============ */
document.getElementById('closeAdmin').addEventListener('click', () => {
  document.getElementById('adminModal').classList.remove('active');
});

document.getElementById('addBookBtn').addEventListener('click', async () => {
  const title = document.getElementById('newTitle').value.trim();
  const author = document.getElementById('newAuthor').value.trim();
  const fileType = document.getElementById('newFileType').value;
  const fileUrl = document.getElementById('newPdfUrl').value.trim();
  const coverUrl = document.getElementById('newCoverUrl').value.trim();
  const pages = parseInt(document.getElementById('newPages').value) || null;
  const year = parseInt(document.getElementById('newYear').value) || null;

  if (!title || !fileUrl){
    alert('El título y la URL del archivo son obligatorios.');
    return;
  }

  try {
    await db.collection('books').add({ title, author, fileType, fileUrl, coverUrl, pages, year });
    document.getElementById('newTitle').value = '';
    document.getElementById('newAuthor').value = '';
    document.getElementById('newFileType').value = 'pdf';
    document.getElementById('newPdfUrl').value = '';
    document.getElementById('newCoverUrl').value = '';
    document.getElementById('newPages').value = '';
    document.getElementById('newYear').value = '';
  } catch(err){
    console.error("Error agregando libro:", err);
    alert('No se pudo agregar el libro.');
  }
});

function renderAdminList(){
  const list = document.getElementById('adminList');
  list.innerHTML = '';
  books.forEach(book => {
    const item = document.createElement('div');
    item.className = 'admin-list-item';
    item.innerHTML = `
      <span>${book.title} — ${book.author || 'N/A'} (${(book.fileType || 'pdf').toUpperCase()})</span>
      <button data-id="${book.id}">Eliminar</button>
    `;
    item.querySelector('button').addEventListener('click', async () => {
      if (confirm(`¿Eliminar "${book.title}"?`)){
        await db.collection('books').doc(book.id).delete();
      }
    });
    list.appendChild(item);
  });
}
